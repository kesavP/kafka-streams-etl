spring:
  application:
    name: keycloak-spring-boot-oauth2
  security:
    oauth2:
      resourceserver:
        jwt:
          # Must exactly match the 'iss' claim in Keycloak tokens
          # Format: {keycloak-url}/realms/{realm-name}
          issuer-uri: http://localhost:8080/realms/demo
          jwk-set-uri: http://localhost:8080/realms/myrealm/protocol/openid-connect/certs



# Management (Actuator) configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # Expose monitoring endpoints
  endpoint:
    health:
      show-details: always  # Show detailed health info
    metrics:
      enabled: true
  metrics:
    export:
      simple:
        enabled: true

spring.output.ansi.enabled: ALWAYS

logging:
  level:
    root: INFO
    com.tribune.demo.ecommerce: DEBUG  # Debug our application
    org.springframework.kafka: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){blue} %clr(---){faint} %clr([%15.15t]){yellow} %clr(%logger{36}){cyan} %clr(:){red} %clr(%m){faint}%n"

server:
  port: 8081
  servlet:
    context-path: /api

